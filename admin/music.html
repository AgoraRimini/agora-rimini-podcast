<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestione brani · Agorà</title><link rel="stylesheet" href="admin.css?v=4"><style>[hidden]{display:none!important}.music-fields{display:grid;gap:16px}.music-fields label{display:grid;gap:6px}progress{width:100%;height:20px}.track-row{padding:18px 0;border-bottom:1px solid #ccd8e0}.track-row button{margin:8px 8px 0 0;min-height:44px}.track-row p{white-space:pre-wrap}.music-fields audio{max-width:100%;width:100%}</style></head><body class="admin-page"><main class="admin-shell"><section class="admin-intro"><a href="./">← Articoli</a><p class="kicker">Area riservata</p><h1>Gestione<br>brani.</h1><p>Carica una sola volta per sito e app. Ogni nuovo brano viene salvato in bozza: lo rendi pubblico solo quando scegli “Pubblica”.</p></section><section class="admin-panel">
<form id="music-login" class="access-form"><h2>Accesso redazione</h2><label>Utente<input id="music-user" autocomplete="username" required></label><label>Password<input id="music-password" type="password" autocomplete="current-password" required></label><button class="admin-button">Accedi</button></form>
<div id="music-editor" hidden><div class="editor-head"><h2>Nuovo brano</h2><button id="music-logout" type="button">Esci</button></div><form id="music-form" class="music-fields">
<label>Titolo<input name="title" maxlength="180" required></label><label>Autore / progetto<input name="artist" maxlength="120" placeholder="No Place To Hide" required></label><label>Data di uscita<input name="date" type="date" required></label><label>Descrizione<textarea name="description" maxlength="4000" rows="4"></textarea></label><label>File MP3 · massimo 30 MB<input id="music-audio" name="audio" type="file" accept="audio/mpeg,audio/mp3,.mp3" required></label><audio id="music-local-preview" controls preload="metadata" hidden></audio><label>Copertina · JPG, PNG o WEBP · massimo 5 MB<input name="cover" type="file" accept="image/jpeg,image/png,image/webp" required></label><input id="music-duration" name="duration" type="hidden"><button id="music-upload" class="admin-button">Carica e salva bozza</button><progress id="music-progress" max="100" value="0" hidden aria-label="Caricamento del brano"></progress></form>
<h2>Brani caricati</h2><button id="music-refresh" type="button">Aggiorna elenco</button><div id="music-tracks"></div></div><p id="music-message" class="form-message" role="status" aria-live="polite"></p></section></main><script src="access-config.js"></script><script src="music.js"></script></body></html>
