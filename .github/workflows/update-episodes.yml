name: Aggiorna pagine puntate e sitemap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-episodes.mjs"
      - "scripts/validate-episodes.mjs"
      - "tests/episode-generation.test.cjs"
      - ".github/workflows/update-episodes.yml"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-episode-pages
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.interval.outputs.due }}
    steps:
      - name: Controlla intervallo di 48 ore
        id: interval
        run: |
          # Epoch-day parity maintains 48-hour spacing across month/year boundaries.
          # Push and manual runs remain available for maintenance and recovery.
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || (( ($(date -u +%s) / 86400) % 2 == 0 )); then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test di regressione aggiornamento RSS
        run: node --test tests/episode-generation.test.cjs

      - name: Genera pagine e sitemap
        run: node scripts/generate-episodes.mjs

      - name: Verifica archivio e metadati SEO
        run: node scripts/validate-episodes.mjs

      - name: Pubblica gli aggiornamenti
        id: commit
        run: |
          git add -- puntate sitemap.xml data/episodes.json data/content-catalog.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nessun aggiornamento."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna pagine puntate e sitemap"
          # Preserve concurrent editorial changes; conflicts fail instead of overwriting.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: generate
    # Explicit checks also allow recovery/verification without inventing a content change.
    if: needs.generate.outputs.changed == 'true' || github.event_name != 'schedule'
    uses: ./.github/workflows/pages.yml
    with:
      episode-update: true
