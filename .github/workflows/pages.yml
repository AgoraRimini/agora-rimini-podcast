name: Pubblica sito su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica e sincronizza il catalogo musicale
        id: sync
        run: |
          node --check scripts/sync-music-catalog.mjs
          node --check music-player.js
          node scripts/sync-music-catalog.mjs
          if git diff --quiet -- data/content-catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/content-catalog.json
            git commit -m "Sincronizza canzoni ospitate sul sito nel CMS"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: catalog
    if: github.event_name != 'schedule' || needs.catalog.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Configura Python per le anteprime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Genera automaticamente le card degli articoli
        run: |
          python -m pip install Pillow==12.1.1
          python scripts/generate-og.py
          python scripts/build-article-headers.py
      - name: Prepara sito statico
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
